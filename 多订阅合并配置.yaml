# ----------------------------------------------------------------------
# YAML 读写
# ----------------------------------------------------------------------
def _new_ruamel():
    """构造往返用 YAML 实例：排版设置与配置文件原有风格一致。

    实测（本目录「多订阅合并配置.yaml」）：默认 emitter 会把整份文件的块序列
    重排成「无偏移」风格、并把超长 URL 折成多行；用下面这组设置时
    「纯加载→导出」与原文件逐字节完全相同。
    """
    y = _RYAML()
    y.preserve_quotes = True                    # 保留原文件的引号风格
    y.indent(mapping=2, sequence=4, offset=2)   # 序列项缩进 4、偏移 2（对齐原文件）
    y.width = 4096                              # 关闭自动折行：长 URL 保持单行
    return y


def load_yaml_text(text):
    if YAML_ENGINE == "ruamel":
        return _new_ruamel().load(text)
    return _pyyaml.safe_load(text)


def dump_yaml_text(data):
    buf = StringIO()
    if YAML_ENGINE == "ruamel":
        _new_ruamel().dump(data, buf)
    else:
        buf.write(_pyyaml.dump(data, allow_unicode=True, sort_keys=False,
                               default_flow_style=False, width=100000))
    return buf.getvalue()


def get_nested(d, path):
    """按 a/b/c 路径取值，返回 (是否存在, 值)"""
    cur = d
    for part in path.split("/"):
        if not isinstance(cur, dict) or part not in cur:
            return False, None
        cur = cur[part]
    return True, cur


def set_nested(d, path, value):
    """按 a/b/c 路径写值，中间层字典不存在则创建"""
    parts = path.split("/")
    cur = d
    for p in parts[:-1]:
        if not isinstance(cur.get(p), dict):
            cur[p] = {}
        cur = cur[p]
    cur[parts[-1]] = value


def del_nested(d, path):
    parts = path.split("/")
    cur = d
    for p in parts[:-1]:
        if not isinstance(cur.get(p), dict):
            return
        cur = cur[p]
    cur.pop(parts[-1], None)


def rename_map_key(mapping, old, new):
    """重命名映射的键并保持在原位置（兼容 ruamel CommentedMap 与普通 dict）"""
    if hasattr(mapping, "insert"):          # ruamel CommentedMap
        idx = list(mapping.keys()).index(old)
        val = mapping.pop(old)
        mapping.insert(idx, new, val)
    else:                                    # 普通 dict：按原顺序重建
        items = [((new if k == old else k), v) for k, v in mapping.items()]
        mapping.clear()
        mapping.update(dict(items))


def insert_map_item(mapping, idx, key, value):
    """在映射的第 idx 个位置插入新键值（保持既有顺序与注释）"""
    if hasattr(mapping, "insert"):           # ruamel CommentedMap
        mapping.insert(idx, key, value)
        return
    items = list(mapping.items())
    items.insert(idx, (key, value))
    mapping.clear()
    mapping.update(dict(items))


def move_map_item(mapping, i, j):
    """交换映射中位置 i 与 j 的两个条目（用于上移/下移）"""
    keys = list(mapping.keys())
    ki, kj = keys[i], keys[j]
    if hasattr(mapping, "insert"):
        if abs(j - i) == 1:
            # 相邻交换：弹出前面的再插回目标位置 j（下移 i<j 时 kj 位于 i，
            # 插到 i+1=j；上移 i>j 时 kj 位于 i-1=j，插到 j）
            vi = mapping.pop(ki)
            mapping.insert(j, ki, vi)
            return
        items = [(k, mapping[k]) for k in keys]
        items[i], items[j] = items[j], items[i]
        mapping.clear()
        for k, v in items:
            mapping.insert(len(mapping), k, v)
    else:
        items = [(k, mapping[k]) for k in keys]
        items[i], items[j] = items[j], items[i]
        mapping.clear()
        mapping.update(dict(items))


def seq_swap_with_comments(seq, i, j):
    """交换序列相邻两个元素，并让注释块跟着它们对应的条目走。

    实测（ruamel 0.18）：条目之间的独立注释块记在「前一个条目」的下标
    ca.items[k] 上，渲染时出现在条目 k 之后、条目 k+1 之前——即视觉上
    属于条目 k+1。因此交换 i/i+1 时需把注释条目 (i-1, i) 一并对调，
    注释才能继续标在原来对应的条目上，而不是死板地留在原下标。
    """
    if j < i:
        i, j = j, i
    seq[i], seq[j] = seq[j], seq[i]
    if not hasattr(seq, "ca"):
        return
    items = seq.ca.items
    a = i - 1
    if a >= 0 and (a in items or i in items):
        va = items.pop(a, None)
        vb = items.pop(i, None)
        if va is not None:
            items[i] = va
        if vb is not None:
            items[a] = vb


# ----------------------------------------------------------------------
# 分流规则的结构化解析与组合
#   规则形态：TYPE,参数,目标策略[,附加参数...]
#   特例：MATCH,目标策略（无参数）；AND/OR/NOT/SUB-RULE 的参数是括号表达式，
#        括号里的逗号不属于分隔符，需按括号深度切分
# ----------------------------------------------------------------------
RULE_TYPES = [
    "DOMAIN", "DOMAIN-SUFFIX", "DOMAIN-KEYWORD", "DOMAIN-REGEX",
    "GEOSITE", "GEOIP", "IP-CIDR", "IP-CIDR6", "IP-ASN", "IP-SUFFIX",
    "SRC-GEOIP", "SRC-IP-ASN", "SRC-IP-CIDR", "SRC-PORT", "DST-PORT",
    "IN-TYPE", "IN-PORT", "IN-USER", "IN-NAME", "NETWORK", "DSCP", "UID",
    "PROCESS-NAME", "PROCESS-PATH", "PROCESS-NAME-REGEX", "PROCESS-PATH-REGEX",
    "RULE-SET", "AND", "OR", "NOT", "SUB-RULE", "MATCH",
]


def split_top_level(text):
    """按逗号切分，但括号 (…) 内的逗号不切分"""
    parts, depth, cur = [], 0, []
    for ch in text:
        if ch == "(":
            depth += 1
        elif ch == ")":
            depth = max(0, depth - 1)
        if ch == "," and depth == 0:
            parts.append("".join(cur))
            cur = []
        else:
            cur.append(ch)
    parts.append("".join(cur))
    return [p.strip() for p in parts]


def parse_rule_text(text):
    """解析为 (类型, 参数, 目标策略, [附加参数])；只有一段无法结构化时返回 None"""
    parts = split_top_level(text)
    if len(parts) == 1:
        return None
    if len(parts) == 2:
        return parts[0].upper(), "", parts[1], []
    return parts[0].upper(), parts[1], parts[2], parts[3:]


def compose_rule_text(rtype, payload, target, extra):
    """由结构化字段组合规则字符串"""
    parts = [rtype]
    if rtype.upper() != "MATCH" and payload:   # MATCH 无参数；参数为空时不产生空段
        parts.append(payload)
    parts.append(target)
    for e in extra.split(","):
        e = e.strip()
        if e:
            parts.append(e)
    return ",".join(parts)


def merge_comment_slots(slots_list):
    """把多个 ca.items 槽位合并成一个（同槽的注释文本依次拼接）"""
    merged = [None, None, None, None]
    for slots in slots_list:
        for i, tok in enumerate(list(slots)[:4]):
            if tok is None:
                continue
            if merged[i] is None:
                merged[i] = tok
            else:
                try:
                    merged[i].value += tok.value
                except Exception:
                    pass                      # 拼不上就保留第一个，不丢结构
    return merged


def split_tail_comment_slots(seq):
    """把「渲染在列表末尾之后」的注释块摘出来单独保管。

    ruamel 按「条目下标」记录注释，语义是渲染在该条目之后；列表长度变化时
    下标会错位——注释跑到列表中间，把末尾元素挤到注释块后面（实测）。
    这里在首次编辑该列表时把末尾注释摘出来，之后每次更新都重新挂到新的末项，
    保证注释始终渲染在整个列表之后。
    """
    if not hasattr(seq, "ca"):
        return []
    cached = getattr(seq, "_tail_comment_slots", None)
    if cached is not None:
        return cached
    items = getattr(seq.ca, "items", None) or {}
    last = len(seq) - 1
    tail = []
    for k in sorted(items.keys(), reverse=True):
        if last >= 0 and k >= last and items[k]:
            tail.append(items.pop(k))
    tail.reverse()
    try:
        seq._tail_comment_slots = tail
    except Exception:
        pass
    return tail


