def risky_exclude_words(value):
    """返回 exclude-filter 里命中的「品牌推广型」关键词（写进通用排除表会误杀真节点）"""
    if not value:
        return []
    low = str(value).replace("\\", "").lower()      # 正则里的 t\.me 先去反斜杠再比
    return [w for w in RISKY_EXCLUDE_WORDS if w.lower() in low]


