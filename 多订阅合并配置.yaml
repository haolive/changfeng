    # ---------- 通用表单构建 ----------
    def build_spec_form(self, parent, spec, out):
        """按规格在 parent 上生成 标签+控件，句柄存入 out[path]"""
        f, fs = self.F, self.FS
        parent.grid_columnconfigure(1, weight=1)   # 控件列随窗口宽度伸缩
        row = 0
        for path, label, kind, extra, optional in spec:
            if kind == "sep":
                ctk.CTkLabel(parent, text=f"◆ {label}", font=f,
                             text_color=("#0969da", "#4fa3e3"), anchor="w").grid(
                    row=row, column=0, columnspan=2, sticky="w", pady=(16, 4))
                row += 1
                continue

            ctk.CTkLabel(parent, text=label, font=fs, anchor="w",
                         width=200, justify="left", wraplength=190).grid(
                row=row, column=0, sticky="w", pady=3)

            if kind == "switch":
                var = tk.BooleanVar(value=False)
                w = ctk.CTkSwitch(parent, text="", variable=var, onvalue=True, offvalue=False)
                w.grid(row=row, column=1, sticky="w", pady=3, padx=(6, 4))
                out[path] = FieldWrap("switch", var.get, lambda v, var=var: var.set(bool(v)))
            elif kind == "textlines":
                w = ctk.CTkTextbox(parent, height=extra or 100, font=f)
                w.grid(row=row, column=1, sticky="ew", pady=3, padx=(6, 4))

                def getter(w=w):
                    return [ln.strip() for ln in w.get("1.0", "end").splitlines() if ln.strip()]

                def setter(v, w=w):
                    w.delete("1.0", "end")
                    w.insert("1.0", "\n".join(str(x) for x in (v or [])))

                out[path] = FieldWrap("textlines", getter, setter)
            elif kind == "combo":
                w = ctk.CTkComboBox(parent, values=extra or [], width=380, font=f)
                w.grid(row=row, column=1, sticky="ew", pady=3, padx=(6, 4))
                out[path] = FieldWrap(
                    "combo",
                    lambda w=w: w.get().strip(),
                    lambda v, w=w: w.set("" if v is None else str(v)))
            else:  # entry / int 共用单行输入框
                width = extra if isinstance(extra, int) else 380
                w = ctk.CTkEntry(parent, width=width, font=f)
                w.grid(row=row, column=1, sticky="ew", pady=3, padx=(6, 4))
                out[path] = FieldWrap(
                    "entry",
                    lambda w=w: w.get().strip(),
                    lambda v, w=w: (w.delete(0, "end"),
                                    w.insert(0, "" if v is None else str(v))))
            row += 1

    def load_spec(self, root, spec, fields):
        """把数据写入表单"""
        for path, _label, kind, _e, _o in spec:
            if kind == "sep":
                continue
            ok, val = get_nested(root, path)
            fld = fields[path]
            if kind == "switch":
                fld.set(bool(val) if ok else False)
            elif kind == "int":
                fld.set(str(val) if ok and val is not None else "")
            elif kind == "textlines":
                fld.set(val if ok and val is not None else [])
            else:
                fld.set(str(val) if ok and val is not None else "")

    def apply_spec(self, root, spec, fields):
        """把表单写回数据；int 做强校验，可选字段留空即删除。

        原则：**值没变就一个字节都不改**——原文件里标量上的引号、
        序列上的缩进与注释块都挂在原对象上，无脑覆盖会连带丢注释。
        值确实变了时，序列就地改内容（保留原集合对象，注释不丢）。
        只有「键本来就不存在且留空」时才跳过，不报错（兼容精简配置）。
        """
        for path, label, kind, _e, optional in spec:
            if kind == "sep":
                continue
            fld = fields[path]
            if kind == "switch":
                want = bool(fld.get())
                ok, cur = get_nested(root, path)
                if ok and bool(cur) == want:
                    continue
                set_nested(root, path, want)
                continue
            if kind == "int":
                raw = str(fld.get()).strip()
                if raw == "":
                    if optional:
                        del_nested(root, path)
                    elif get_nested(root, path)[0]:
                        raise CommitError(f"「{label}」不能为空")
                    # 键本就不存在：留空视为不添加，不报错
                else:
                    try:
                        val = int(raw)
                    except ValueError:
                        raise CommitError(f"「{label}」必须是整数，当前输入：{raw}")
                    ok, cur = get_nested(root, path)
                    if ok and isinstance(cur, int) and not isinstance(cur, bool) \
                            and cur == val:
                        continue
                    set_nested(root, path, val)
                continue
            if kind == "textlines":
                lines = fld.get()
                if not lines:
                    if optional:
                        del_nested(root, path)
                    elif get_nested(root, path)[0]:
                        raise CommitError(f"「{label}」至少需要一行")
                    continue
                ok, cur = get_nested(root, path)
                if ok and isinstance(cur, list) and list(cur) == lines:
                    continue                      # 内容未变，别动原对象
                if ok and isinstance(cur, list):
                    self._update_list_inplace(cur, lines)
                else:
                    set_nested(root, path, lines)
                continue
            raw = str(fld.get())
            if raw:
                ok, cur = get_nested(root, path)
                if ok and str(cur) == raw:
                    continue
                set_nested(root, path, raw)
            elif optional:
                del_nested(root, path)
            elif get_nested(root, path)[0]:
                raise CommitError(f"「{label}」不能为空")

    @staticmethod
    def _update_list_inplace(seq, lines):
        """就地更新列表内容：保留原集合对象、末尾注释块、原值对象的引号风格"""
        tail = split_tail_comment_slots(seq)       # 末尾注释块，稍后挂回新的末项
        # 原值对象池：按值缓存原文件里的标量对象。新内容能复用时，
        # 引号风格（如 "https://..." / '+.lan'）得以保留；改回原值也仍是原样
        pool = getattr(seq, "_orig_items_pool", None)
        if pool is None:
            pool = {}
            for item in seq:
                pool.setdefault(str(item), []).append(item)
            try:
                seq._orig_items_pool = pool
            except Exception:
                pass
        rebuilt = []
        for val in lines:
            # 同一值多次出现时复用同一个原值对象即可（标量不可变，导出无副作用）
            rebuilt.append(pool[val][0] if val in pool else val)
        seq[:] = rebuilt
        # 中间注释按下标保留（越界的一律丢弃），末尾注释统一挂到最后一项
        if hasattr(seq, "ca"):
            items = seq.ca.items
            for k in [k for k in items if not (0 <= k < len(seq))]:
                items.pop(k, None)
            if tail and len(seq):
                items[len(seq) - 1] = merge_comment_slots(tail)

