    # ---------- 分流规则：数据与表单联动 ----------
    def rules_container(self, create=False):
        if self.data is None:
            return None
        if "rules" not in self.data:
            if not create:
                return []
            self.data["rules"] = []
        return self.data["rules"]

    def refresh_rules(self):
        for w in self.rules_box.winfo_children():
            w.destroy()
        rules = self.rules_container()
        for i, r in enumerate(rules or []):
            selected = (i == self.rules_sel)
            text = str(r).strip()
            if not text:
                text = "（空白，请在右侧填写）"      # 新建的空白规则
            btn = ctk.CTkButton(
                self.rules_box,
                text=f"{i + 1:>2}.  {text}",
                anchor="w", font=self.F,
                fg_color="#2b5b8a" if selected else "transparent",
                hover_color="#2b5b8a" if selected else ("gray70", "gray30"),
                text_color="#ffffff" if selected else ("gray10", "#dcdcdc"),
                command=lambda i=i: self.rule_pick(i))
            btn.pack(fill="x", padx=6, pady=1)

    def _rule_targets(self):
        """目标策略下拉选项 = 内置策略 + 当前所有代理组名。
        Mihomo 官方还支持直接填单个节点名（订阅动态生成，无法枚举，手动输入即可）。"""
        base = ["DIRECT", "REJECT", "REJECT-DROP", "PASS", "GLOBAL"]
        groups = []
        if isinstance(self.data, dict):          # 空白启动时 data 为 None
            groups = [str(g.get("name")) for g in (self.data.get("proxy-groups") or [])
                      if isinstance(g, dict) and g.get("name")]
        return base + groups

    @staticmethod
    def _set_entry(w, value):
        if hasattr(w, "set"):                 # CTkComboBox
            w.set("" if value is None else str(value))
        else:                                 # CTkEntry
            w.delete(0, "end")
            w.insert(0, "" if value is None else str(value))

    def rule_pick(self, i):
        self.rules_sel = i
        rules = self.rules_container()
        if rules and 0 <= i < len(rules):
            self.rule_target_cb.configure(values=self._rule_targets())
            self._set_entry(self.rule_raw_entry, str(rules[i]))
            self._rule_parse_raw()
            self.rule_sel_label.configure(text=f"正在编辑第 {i + 1} 条")
        self.refresh_rules()

    def _rule_compose_preview(self, *_):
        """由结构化字段组合规则原文（类型为空时不组合）"""
        rtype = self.rule_type_cb.get().strip()
        payload = self.rule_payload_entry.get().strip()
        target = self.rule_target_cb.get().strip()
        extra = self.rule_extra_entry.get().strip()
        if not rtype:
            self.rule_preview_label.configure(
                text="（规则类型为空：不自动组合，请直接编辑规则原文）")
            return
        if not target:
            self.rule_preview_label.configure(
                text="（目标策略为空：填好类型/参数/目标后自动组合，或直接编辑原文）")
            return
        raw = compose_rule_text(rtype, payload, target, extra)
        self._set_entry(self.rule_raw_entry, raw)
        self.rule_preview_label.configure(text=raw)

    def _rule_raw_changed(self, *_):
        """用户手改原文时只刷新预览，不打断输入"""
        raw = self.rule_raw_entry.get().strip()
        self.rule_preview_label.configure(text=raw if raw else "（规则原文为空）")

    def _rule_parse_raw(self):
        """把规则原文解析进结构化字段"""
        raw = self.rule_raw_entry.get().strip()
        if not raw:
            # 新建的空白规则：清空结构化字段，等用户填写
            for w in (self.rule_type_cb, self.rule_payload_entry,
                      self.rule_target_cb, self.rule_extra_entry):
                self._set_entry(w, "")
            self.rule_preview_label.configure(
                text="（空白规则：填好类型/参数/目标，或直接填规则原文）")
            self.rule_parse_hint.configure(text="")
            return
        parsed = parse_rule_text(raw)
        if parsed is None:
            for w in (self.rule_type_cb, self.rule_payload_entry,
                      self.rule_target_cb, self.rule_extra_entry):
                self._set_entry(w, "")
            self.rule_preview_label.configure(text=raw if raw else "（规则原文为空）")
            self.rule_parse_hint.configure(text="该规则只有一段，无法按结构解析，请直接编辑原文")
            return
        rtype, payload, target, extras = parsed
        self.rule_type_cb.configure(values=RULE_TYPES)
        self.rule_target_cb.configure(values=self._rule_targets())
        self._set_entry(self.rule_type_cb, rtype)
        self._set_entry(self.rule_payload_entry, payload)
        self._set_entry(self.rule_target_cb, target)
        self._set_entry(self.rule_extra_entry, ",".join(extras))
        self.rule_preview_label.configure(text=raw)
        self.rule_parse_hint.configure(text="已按结构解析到上方各字段")

    def _rule_clear_form(self):
        for w in (self.rule_type_cb, self.rule_payload_entry, self.rule_target_cb,
                  self.rule_extra_entry, self.rule_raw_entry):
            self._set_entry(w, "")
        self.rule_preview_label.configure(text="（未选择规则）")
        self.rule_parse_hint.configure(text="")
        if getattr(self, "rule_sel_label", None) is not None:
            self.rule_sel_label.configure(text="（点击规则行载入编辑）")

    def _rule_text(self):
        # 结构化字段的每次修改都会实时同步到原文（KeyRelease / 下拉回调），
        # 手改原文也不会被覆盖，因此这里直接以原文为准
        t = self.rule_raw_entry.get().strip()
        if not t:
            raise CommitError("规则内容不能为空（在右侧填结构化字段，或直接填规则原文）")
        return t

    def rule_commit_if_dirty(self):
        """把右侧表单里还没写回的改动落到选中规则上（与其它分页切换/移动前的自动写回一致）"""
        rules = self.rules_container()
        if not rules or self.rules_sel is None or not (0 <= self.rules_sel < len(rules)):
            return
        t = self.rule_raw_entry.get().strip()
        if not t or t == str(rules[self.rules_sel]).strip():
            return
        old = rules[self.rules_sel]
        rules[self.rules_sel] = t
        self.log(f"分流规则：第 {self.rules_sel + 1} 条「{old}」→「{t}」")

    def rule_new(self):
        """在选中条目下方新建一条空白规则（未选中时加到末尾）"""
        self.rule_commit_if_dirty()          # 先落盘当前编辑，避免被清空
        rules = self.rules_container(create=True)
        n = len(rules)
        pos = (self.rules_sel + 1) if self.rules_sel is not None and self.rules_sel < n else n
        prev = str(rules[pos - 1]) if pos > 0 else None
        rules.insert(pos, "")
        # 注释跟随：原本标注第 pos 条的注释块（记在 pos-1 上）改记到 pos，
        # 才能继续贴在原条目上方，而不是跑到新规则头上
        if hasattr(rules, "ca") and 0 < pos < len(rules):
            items = rules.ca.items
            if (pos - 1) in items:
                items[pos] = items.pop(pos - 1)
        self.rules_sel = pos
        self._rule_clear_form()
        if getattr(self, "rule_sel_label", None) is not None:
            self.rule_sel_label.configure(text=f"正在编辑第 {pos + 1} 条（空白）")
        self.refresh_rules()
        where = f"「{prev}」下方" if prev else "列表末尾"
        self.log(f"分流规则：已在{where}新建空白规则（第 {pos + 1} 条）——"
                 f"在右侧填好内容后点「保存修改到选中」；空规则会让 Clash 加载失败",
                 "warn")

    def rule_modify(self):
        rules = self.rules_container()
        if not rules:
            self.log("当前没有规则可修改", "warn")
            return
        if self.rules_sel is None or not (0 <= self.rules_sel < len(rules)):
            self.log("请先点击列表中的某条规则再「保存修改到选中」", "warn")
            return
        try:
            t = self._rule_text()
        except CommitError as e:
            self.log(str(e), "err")
            return
        old = rules[self.rules_sel]
        rules[self.rules_sel] = t
        self.log(f"分流规则：第 {self.rules_sel + 1} 条「{old}」→「{t}」")
        self.refresh_rules()

    def rule_move(self, delta):
        rules = self.rules_container()
        if not rules or self.rules_sel is None:
            self.log("请先点击列表中的某条规则", "warn")
            return
        j = self.rules_sel + delta
        if not (0 <= j < len(rules)):
            return
        self.rule_commit_if_dirty()          # 先落盘当前编辑，移动后会重新载入表单
        seq_swap_with_comments(rules, self.rules_sel, j)
        self.log(f"分流规则：第 {self.rules_sel + 1} 条已{'上' if delta < 0 else '下'}移到第 {j + 1} 条")
        self.rules_sel = j
        self.rule_pick(j)

    def rule_delete(self):
        rules = self.rules_container()
        if not rules or self.rules_sel is None:
            self.log("请先点击列表中的某条规则", "warn")
            return
        pos = self.rules_sel
        self.rule_commit_if_dirty()          # 先把改动落盘再删（日志顺序更清楚）
        # 注释跟随：先整理注释条目再删条目。
        #   * 被删条目的注释块（记在 pos-1 上）一并删除
        #   * 下一条目的注释块（记在 pos 上）跟着它回移到 pos-1
        #   * ruamel 的 pop 会删掉 key==pos 的注释并下移其余（此时 key==pos 已空，
        #     其余各注释恰好跟着各自条目就位）
        if hasattr(rules, "ca") and pos > 0:
            items = rules.ca.items
            items.pop(pos - 1, None)
            if pos in items:
                items[pos - 1] = items.pop(pos)
        old = rules.pop(pos)
        self.rules_sel = None
        self._rule_clear_form()
        self.log(f"分流规则：已删除「{old}」")
        self.refresh_rules()

    # ---------- 规则顺序检测 ----------
    BUILTIN_TARGETS = ("DIRECT", "REJECT", "REJECT-DROP", "PASS", "GLOBAL")
    # 这些 GEOSITE 集合代表「国内域名直连」，广告规则排在它们之后会被吃掉
    _CN_SITE_SETS = ("cn", "geolocation-cn", "apple-cn", "cn@cn")

    @staticmethod
    def _rule_parts(r):
        """把规则拆成 (类型, 参数, 目标策略)；无法识别返回 None"""
        parts = split_top_level(str(r))
        if not parts or not parts[0]:
            return None
        rtype = parts[0].upper()
        payload = parts[1] if len(parts) >= 2 and rtype != "MATCH" else ""
        if len(parts) >= 3:
            target = parts[2]          # 目标策略固定在第 3 段，后面是附加参数
        elif len(parts) == 2:
            target = parts[1]          # 如 MATCH,漏网之鱼
        else:
            target = ""
        return rtype, payload, target

    @staticmethod
    def _is_direct_target(target):
        return target == "DIRECT" or "直连" in target

    @staticmethod
    def _is_ad_rule(rtype, payload, target):
        if target.upper().startswith("REJECT"):
            return True
        low = payload.lower()
        return any(k in low or k in payload
                   for k in ("ads", "adblock", "track", "malware", "广告", "跟踪"))

    def check_rules_order(self):
        """检测规则顺序问题：MATCH 位置、失效规则、广告拦截被直连挡住、
        引用不存在的策略组/规则集、重复规则等。结果输出到日志并弹窗汇总。"""
        rules = self.rules_container() or []
        if not rules:
            self.log("规则顺序检测：当前没有规则", "warn")
            return
        groups = {str(g.get("name")) for g in (self.data.get("proxy-groups") or [])
                  if isinstance(g, dict) and g.get("name")}
        rproviders = set(self.data.get("rule-providers") or {})
        valid_targets = set(self.BUILTIN_TARGETS) | groups
        problems = []              # (级别, 下标, 消息)
        match_idx = None
        first_seen = {}

        for i, r in enumerate(rules):
            parsed = self._rule_parts(r)
            if parsed is None:
                if not str(r).strip():
                    problems.append(("err", i,
                                     "规则为空（新建后还没填写）——空规则会使 Clash 配置加载失败"))
                else:
                    problems.append(("warn", i, "规则无法识别，请检查格式（如 TYPE,参数,目标策略）"))
                continue
            rtype, payload, target = parsed
            # MATCH 必须唯一且在最后
            if rtype == "MATCH":
                if match_idx is not None:
                    problems.append(("err", i,
                                     f"出现第二个 MATCH 兜底（第 {match_idx + 1} 条已有），本条永不生效"))
                else:
                    match_idx = i
            elif match_idx is not None:
                problems.append(("err", i,
                                 f"MATCH 之后的规则永不生效（MATCH 在第 {match_idx + 1} 条）"))
            # 目标策略有效性
            if not target:
                problems.append(("err", i, "缺少目标策略（格式：类型,参数,目标策略）"))
            elif target not in valid_targets:
                problems.append(("warn", i,
                                 f"目标策略「{target}」既不是内置策略也不是代理组名"
                                 f"（若为订阅里的单个节点名可忽略）"))
            # RULE-SET 引用存在性
            if rtype == "RULE-SET":
                if not payload:
                    problems.append(("err", i, "RULE-SET 缺少规则集名称"))
                elif payload not in rproviders:
                    problems.append(("err", i, f"引用的规则集「{payload}」在「规则集」页不存在"))
            # 重复规则
            key = str(r)
            if key in first_seen:
                problems.append(("warn", i, f"与第 {first_seen[key] + 1} 条完全重复"))
            else:
                first_seen[key] = i

        # 广告拦截被国内直连挡住（广告规则必须排在 GEOSITE,cn / GEOIP,CN 直连之前）
        cn_direct = []
        for i, r in enumerate(rules):
            parsed = self._rule_parts(r)
            if parsed is None:
                continue
            rtype, payload, target = parsed
            if rtype == "MATCH":
                break
            if self._is_direct_target(target) and (
                    (rtype == "GEOSITE" and (payload in self._CN_SITE_SETS
                                             or payload.startswith("cn@")
                                             or payload.endswith("@cn")))
                    or (rtype == "GEOIP" and payload.upper() == "CN")):
                cn_direct.append(i)
        for i, r in enumerate(rules):
            parsed = self._rule_parts(r)
            if parsed is None:
                continue
            rtype, payload, target = parsed
            if rtype == "MATCH":
                break
            if self._is_ad_rule(rtype, payload, target):
                blockers = [p + 1 for p in cn_direct if p < i]
                if blockers:
                    problems.append((
                        "err", i,
                        f"广告拦截规则被更靠前的国内直连规则（第 {'、'.join(map(str, blockers))} 条）"
                        f"挡住，命中直连的广告域名会先被放行，导致拦截失效"))

        if match_idx is None:
            problems.append(("warn", -1, "缺少 MATCH 兜底规则，未匹配流量的走向将不可控"))

        n_err = sum(1 for p in problems if p[0] == "err")
        n_warn = len(problems) - n_err
        if not problems:
            self.log(f"规则顺序检测：共 {len(rules)} 条规则，全部通过，未发现问题", "ok")
            mb.showinfo("规则检测", f"共 {len(rules)} 条规则，检测通过，未发现问题。")
            return
        for level, i, msg in problems:
            where = f"第 {i + 1} 条" if i >= 0 else "全局"
            self.log(f"规则检测 {where}［{'错误' if level == 'err' else '警告'}］：{msg}", level)
        mb.showwarning("规则检测", f"发现 {n_err} 个错误、{n_warn} 个警告，详情见日志区。")

    # ---------- 原始 YAML 页 ----------
    def _build_raw_tab(self, tab):
        f = self.F
        tab.grid_rowconfigure(1, weight=1)
        tab.grid_columnconfigure(0, weight=1)
        bar = ctk.CTkFrame(tab, fg_color="transparent")
        bar.grid(row=0, column=0, sticky="ew", padx=8, pady=(8, 2))
        ctk.CTkButton(bar, text="从当前配置刷新", width=150, font=f,
                      command=self.raw_refresh).pack(side="left", padx=(0, 6))
        ctk.CTkButton(bar, text="把文本应用为当前配置", width=170, font=f,
                      fg_color="#2f7d4f", hover_color="#3a9663", text_color="#ffffff",
                      command=self.raw_apply).pack(side="left")
        ctk.CTkLabel(bar, text="适合修改表单未覆盖的字段（如被注释的 tun 块）。"
                              "应用成功后各标签页自动刷新。",
                     font=self.FS, text_color=("#57606a", "#8a9299")).pack(side="left", padx=10)
        self.raw_box = ctk.CTkTextbox(tab, font=f)
        self.raw_box.grid(row=1, column=0, sticky="nsew", padx=8, pady=(2, 8))

    def raw_refresh(self):
        if self.data is None:
            self.log("尚未加载配置", "warn")
            return
        text = dump_yaml_text(self.data)
        self.raw_box.delete("1.0", "end")
        self.raw_box.insert("1.0", text)
        # 记录快照：用来判断「原始YAML」页里是否有用户手改但尚未应用的内容
        # （不能用「与当前 data 的导出不一致」来判断——表单里改了别处也会不一致）
        self._raw_snapshot = text

    def raw_has_unapplied_edits(self):
        """「原始YAML」页是否被手改过且未应用"""
        snapshot = getattr(self, "_raw_snapshot", None)
        if snapshot is None:
            return False
        try:
            return self.raw_box.get("1.0", "end").strip() != snapshot.strip()
        except Exception:
            return False

    def raw_apply(self, silent=False):
        text = self.raw_box.get("1.0", "end")
        try:
            data = load_yaml_text(text)
        except Exception as e:
            msg = str(e)[:600]
            self.log(f"原始 YAML 解析失败：{msg}", "err")
            mb.showerror("解析失败", f"YAML 解析失败：\n{msg}")
            return False
        if not isinstance(data, dict):
            mb.showerror("解析失败", "YAML 顶层必须是键值映射")
            return False
        self.data = data
        self.rules_sel = None
        self.refresh_all()
        if not silent:
            self.log("原始 YAML 已应用，所有标签页已刷新", "ok")
        return True

    # ---------- 帮助页 ----------
    def _build_help_tab(self, tab):
        tab.grid_rowconfigure(0, weight=1)
        tab.grid_columnconfigure(0, weight=1)
        box = ctk.CTkTextbox(tab, font=self.F)
        box.grid(row=0, column=0, sticky="nsew", padx=8, pady=8)
        # tkinter Text 的 tag 不支持深浅色元组，用深浅背景下都可读的固定色
        box.tag_config("h1", foreground="#0969da")
        box.tag_config("code", foreground="#9a6700")
        box.tag_config("warn", foreground="#cf222e")
        box.tag_config("dim", foreground="#6e7781")
        # CTkTextbox 禁止 tag_config 设字体，通过底层 Text 设置（标题加粗/代码等宽）
        tk_box = getattr(box, "_textbox", None)
        if tk_box is not None:
            tk_box.tag_config("h1", font=self.FB)
            tk_box.tag_config("code", font=("Consolas", 12))
        for style, text in HELP_CONTENT:
            if style == "h1":
                box.insert("end", text + "\n\n", "h1")
            elif style in ("code", "warn", "dim"):
                box.insert("end", text + "\n", style)
                box.insert("end", "\n")
            else:
                box.insert("end", text + "\n")
        box.insert("end", "\n—— 帮助结束 ——\n", "dim")
        box.configure(state="disabled")

    # ================= 日志 =================
    def _build_log(self):
        bar = ctk.CTkFrame(self, fg_color="transparent")
        bar.grid(row=2, column=0, sticky="ew", padx=10, pady=(0, 2))
        ctk.CTkLabel(bar, text="日志", font=self.FS,
                     text_color=("#57606a", "#8a9299")).pack(side="left")
        self.log_box = ctk.CTkTextbox(self, height=90, font=self.F)
        self.log_box.grid(row=3, column=0, sticky="ew", padx=10, pady=(0, 10))
        self.log_box.configure(state="disabled")
        # 同上：深浅背景下都可读的固定色
        self.log_box.tag_config("err", foreground="#e5534b")
        self.log_box.tag_config("warn", foreground="#bf8700")
        self.log_box.tag_config("ok", foreground="#2da44e")

    def log(self, msg, level="info"):
        ts = datetime.datetime.now().strftime("%H:%M:%S")
        tag = level if level in ("err", "warn", "ok") else None
        self.log_box.configure(state="normal")
        if tag:      # 不能传 None：tkinter 会把它当成名为 "None" 的标签
            self.log_box.insert("end", f"[{ts}] {msg}\n", tag)
        else:
            self.log_box.insert("end", f"[{ts}] {msg}\n")
        self.log_box.see("end")
        self.log_box.configure(state="disabled")

    # ================= 文件操作 =================
    def load_file(self, path, confirm=True):
        if confirm and self.data is not None:
            if not mb.askyesno("确认", "重新加载将丢弃未保存的修改，继续？"):
                return
        try:
            with open(path, "r", encoding="utf-8-sig") as fh:
                text = fh.read()
        except OSError as e:
            self.log(f"读取失败：{e}", "err")
            mb.showerror("读取失败", str(e))
            return
        try:
            data = load_yaml_text(text)
        except Exception as e:
            msg = str(e)[:600]
            self.log(f"YAML 解析失败：{msg}", "err")
            mb.showerror("解析失败", f"YAML 解析失败：\n{msg}")
            return
        if not isinstance(data, dict):
            mb.showerror("解析失败", "YAML 顶层必须是键值映射")
            return
        self.data = data
        self.config_path = path
        self.rules_sel = None
        self._show_path(path)
        self.refresh_all()
        engine = "ruamel.yaml（保留注释）" if YAML_ENGINE == "ruamel" else "PyYAML（保存将丢失注释！）"
        self.log(f"已加载：{path}")
        self.log(f"订阅源 {len(data.get('proxy-providers') or {})} 个 ｜ "
                 f"规则集 {len(data.get('rule-providers') or {})} 个 ｜ "
                 f"代理组 {len(data.get('proxy-groups') or [])} 个 ｜ "
                 f"分流规则 {len(data.get('rules') or [])} 条 ｜ YAML 引擎：{engine}")

    def refresh_all(self):
        # 全局设置
        self.load_spec(self.data, GLOBAL_SPEC, self.global_fields)
        # DNS
        self.load_spec(self.data.get("dns") or {}, DNS_SPEC, self.dns_fields)
        # 三个条目页
        for tab in (self.provider_tab, self.rprovider_tab, self.group_tab):
            tab.sel = None
            tab.clear_form()
            tab.refresh_list()
        # 分流规则 / 原始 YAML
        self._rule_clear_form()
        self.refresh_rules()
        self.raw_refresh()

    def commit_all(self):
        """把所有表单写回 self.data；任一校验失败抛 CommitError"""
        pages = [("订阅源", self.provider_tab), ("规则集", self.rprovider_tab),
                 ("代理组", self.group_tab)]
        for title, tab in pages:
            try:
                tab.commit()
            except CommitError as e:
                raise CommitError(f"[{title}] {e}")
        try:
            self.apply_spec(self.data, GLOBAL_SPEC, self.global_fields)
        except CommitError as e:
            raise CommitError(f"[全局设置] {e}")
        dns = self.data.setdefault("dns", {})
        try:
            self.apply_spec(dns, DNS_SPEC, self.dns_fields)
        except CommitError as e:
            raise CommitError(f"[DNS] {e}")

    def on_save(self, save_as=False):
        if self.data is None:
            self.log("尚未加载配置，无法保存", "warn")
            return
        # 「原始YAML」页若有未应用的修改，先问清楚：直接保存会写回旧数据，用户的文本改动会白改
        if self.raw_has_unapplied_edits():
            ans = mb.askyesnocancel(
                "原始YAML页有未应用的修改",
                "「原始YAML」页的内容与当前配置不一致，还没点「把文本应用为当前配置」。\n\n"
                "是：先把文本应用为当前配置，再保存\n"
                "否：忽略文本里的修改，直接保存当前配置\n"
                "取消：中止保存")
            if ans is None:
                self.log("已取消保存（原始YAML页有未应用的修改）", "warn")
                return
            if ans:
                if not self.raw_apply(silent=True):
                    self.log("原始 YAML 应用失败，保存中止", "err")
                    return
                self.log("已将原始 YAML 页的文本应用为当前配置", "ok")
        try:
            self.commit_all()
        except CommitError as e:
            self.log(f"保存取消：{e}", "err")
            mb.showerror("保存取消", f"有字段未通过校验：\n{e}")
            return
        # 空规则会让 Clash 加载配置失败，保存前提醒（新建后忘了填写的情况）
        blanks = [i + 1 for i, r in enumerate(self.rules_container() or [])
                  if not str(r).strip()]
        if blanks:
            if not mb.askyesno(
                    "存在空白规则",
                    f"第 {'、'.join(map(str, blanks))} 条规则是空的，"
                    f"空规则会让 Clash 加载配置失败。\n\n仍然保存吗？"):
                self.log(f"已取消保存（第 {'、'.join(map(str, blanks))} 条为空规则）", "warn")
                return
        if save_as or not self.config_path:
            path = fd.asksaveasfilename(
                title="另存为", defaultextension=".yaml",
                filetypes=[("YAML", "*.yaml *.yml"), ("所有文件", "*.*")])
            if not path:
                return
        else:
            path = self.config_path

        if YAML_ENGINE == "pyyaml":
            if not mb.askyesno(
                    "警告",
                    "未安装 ruamel.yaml，保存将丢失整个文件的注释。\n"
                    "建议先执行：pip install ruamel.yaml\n\n仍要继续保存吗？"):
                self.log("已取消保存（避免丢失注释）", "warn")
                return

        text = dump_yaml_text(self.data)
        backed = ""
        try:
            existed = os.path.exists(path)
            if self.backup_enabled and existed:
                shutil.copy2(path, path + ".bak")
                backed = f"（已备份原文件到 {os.path.basename(path)}.bak）"
            elif existed and not self.backup_enabled:
                backed = "（未备份，已直接覆盖原文件）"
            with open(path, "w", encoding="utf-8", newline="") as fh:
                fh.write(text)
        except OSError as e:
            self.log(f"写入失败：{e}", "err")
            mb.showerror("写入失败", str(e))
            return
        self.config_path = path
        self._show_path(path)
        self.log(f"已保存：{path} {backed}", "ok")
        self.raw_refresh()

    def on_open(self):
        if self.data is not None and not mb.askyesno(
                "确认", "打开新文件将丢弃未保存的修改，继续？"):
            return
        path = fd.askopenfilename(
            title="选择配置文件",
            filetypes=[("YAML", "*.yaml *.yml"), ("所有文件", "*.*")])
        if path:
            self.load_file(path, confirm=False)

    def on_reload(self):
        if not self.config_path:
            self.log("尚未加载任何文件", "warn")
            return
        self.load_file(self.config_path, confirm=True)


def main():
    app = ConfigEditorApp()
    app.mainloop()


if __name__ == "__main__":
    try:
        main()
    except Exception:
        err = traceback.format_exc()
        try:
            mb.showerror("启动失败", err)
        except Exception:
            pass
        raise
