    def _show_path(self, path):
        """显示当前文件路径；过长时保留末尾（文件名最有用）并截断，避免挤出右侧按钮"""
        if not path:
            self.path_label.configure(text="（未加载文件）")
            return
        font = getattr(self, "_path_font", None)
        if font is None:
            font = self._path_font = tkfont.Font(font=self.FS)
        if font.measure(path) <= PATH_LABEL_MAX_PX:
            self.path_label.configure(text=path)
            return
        tail = path
        while tail and font.measure("…" + tail) > PATH_LABEL_MAX_PX:
            tail = tail[1:]
        self.path_label.configure(text="…" + tail)

