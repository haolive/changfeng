# ============================================================
# 多订阅合并配置（Clash Verge Rev / Mihomo）
# ------------------------------------------------------------
# 用法：
#   1. Clash Verge Rev -> 订阅 -> 打开配置目录，把本文件放入 profiles 目录
#       或直接「新建配置 -> 本地配置 -> 选择本文件导入」
#   2. 右键该配置卡片 -> 启用
#   3. 首次使用请打开「节点选择/自动选择」分组，等待健康检查完成后选择可用节点
#   4. 确认「本次配置是否已开始加载」：日志里出现下面这一行就说明加载了（中文标记，方便一眼认出）
#        Start initial provider 【配置已加载】AWAvenue广告规则
#      —— 这行是 rule-provider 初始化时内核打印的，名字里的【配置已加载】前缀纯为提示用
#
# 特性：
#   * 多个订阅通过 proxy-providers 合并，节点名前缀 S1~Sn 区分来源
#   * provider 层 exclude-filter 只留"状态型"词（剩余/流量/到期/过期/重置/traffic/expire/expired），
#     用来剔除「剩余流量：100GB」「到期时间」这类信息行。
#     ⚠ 别把"品牌推广型"词（tg频道 / t.me / http / 官网 / 订阅 / 机场 / 邀请 / 返利…）写进排除表：
#       2026-09-23 实测，在 2534 个节点里它误杀了 66 个**可用**节点（真正剔掉的垃圾只有 2 个），
#       其中某机场的节点名统一是「✈️关注TG频道@stymei NN」，一个 `tg频道` 就把整源 26/26 过滤干净，
#       内核只报一行 pull error: file doesn't have any proxy —— 整个源静默清零，界面上看不出来。
#   * GEOSITE/GEOIP 分流规则（使用内置 geo 数据库，无需额外下载规则集）
#   * AWAvenue 广告规则集（rule-providers 远程拉取，自动更新，952 条国内 App 广告域名）
#     —— 该 provider 名字带【配置已加载】前缀，用作启动日志的中文标记，详见「用法」第 4 条
#   * 所有 provider 走 proxy: DIRECT 拉取 —— provider 拉取请求会进规则引擎、落到节点上，
#     节点一死订阅和规则集就一起拉不动（日志实证），故让拉取与节点健康度解耦
#   * DNS 走 DoH + fake-ip，国内域名直连解析
#   * DNS 只用国内服务器（不吃 fallback）—— 落地的域名要能被解析，见 dns 段落里的说明
# ============================================================

# ---------------- 订阅节点来源 ----------------
proxy-providers:
  s1-NoMoreWalls:
    type: http
    path: ./providers/s1_list.meta.yml
    url: "https://github.boki.moe/https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.meta.yml"
    interval: 3600            # 更新间隔（秒），免费池变动频繁，可按需调小（如 1800）
    proxy: DIRECT             # 拉取走直连：boki 直连实测 1.5s，不该被死节点拖住
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 2000
      lazy: true
    override:
      additional-prefix: "S1 |"
      skip-cert-verify: true   # 免费节点证书常不可信，跳过校验
    exclude-filter: '(?i)(剩余|流量|到期|过期|重置|traffic|expire|expired)'
  s2-shaoyouvip:
    type: http
    path: ./providers/s2_shaoyouvip.yaml
    url: "https://github.boki.moe/https://raw.githubusercontent.com/shaoyouvip/free/main/mihomo.yaml"
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 2000
      lazy: true
    override:
      additional-prefix: "S2 |"
      skip-cert-verify: true
    exclude-filter: '(?i)(剩余|流量|到期|过期|重置|traffic|expire|expired)'
  s3-free-proxy-airport:
    type: http
    path: ./providers/s3_free_proxy_airport.yaml
    url: "https://sunmiao4458.github.io/free-proxy-airport/clash.yaml"
    interval: 3600
    proxy: DIRECT             # 实测直连 199ms、200/18101 字节，与节点拉取的缓存字节数一致
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 2000
      lazy: true
    override:
      additional-prefix: "S3 |"
      skip-cert-verify: true
    exclude-filter: '(?i)(剩余|流量|到期|过期|重置|traffic|expire|expired)'
  s4-free-nodes:
    type: http
    path: ./providers/s4_free_nodes.yaml
    url: "https://github.boki.moe/https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/clash_config.yaml"
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 2000
      lazy: true
    override:
      additional-prefix: "S4 |"
      skip-cert-verify: true
    exclude-filter: '(?i)(剩余|流量|到期|过期|重置|traffic|expire|expired)'
  s5-sub445569:
    type: http
    path: ./providers/s5_sub445569.yaml
    url: "https://sub.445569.xyz/"
    interval: 1800            # 该源节点轮换快（实测一小时里 17->29 个），缩短到 30 分钟
    proxy: DIRECT             # 实测直连 200/182127 字节（2026-09-23，带 clash UA）
    # ⚠ 该源按 User-Agent 分流：带 clash UA 才返回 Clash 配置（182127 字节），
    #   不带 UA 只返回 base64 订阅（8108 字节）。内核默认 UA 是 clash.meta/<版本>，
    #   实测能拿到 Clash 配置，所以别给它加 user-agent 覆盖项。
    # ⚠ 这个机场的节点名统一是「✈️关注TG频道@stymei NN」。2026-09-23 实测：排除表里只要有
    #   `tg频道`，它的节点就会被 26/26 全部过滤掉，内核随即报 "file doesn't have any proxy"
    #   —— 整个源静默清零。排除词收窄成"只留状态型词"之后才恢复正常（见文件顶部说明）。
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 2000
      lazy: true
    override:
      additional-prefix: "S5 |"
      skip-cert-verify: true
    exclude-filter: '(?i)(剩余|流量|到期|过期|重置|traffic|expire|expired)'
  s6-FreeSubsCheck:
    type: http
    path: ./providers/s6_FreeSubsCheck.yaml
    url: "https://github.boki.moe/https://raw.githubusercontent.com/kooker/FreeSubsCheck/main/mihomo.yaml"
    interval: 1800            # 该源是「可用性检测」仓库，只留当时通过的节点、轮换很快
                              #（实测一小时里 1->7 个），所以比别的源拉得勤一些
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 2000
      lazy: true
    override:
      additional-prefix: "S6 |"
      skip-cert-verify: true
    exclude-filter: '(?i)(剩余|流量|到期|过期|重置|traffic|expire|expired)'
  s7-proxypool:
    type: http
    path: ./providers/s7_proxypool.yaml
    url: https://github.boki.moe/https://raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta-2.yaml
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 2000
      lazy: true
    override:
      additional-prefix: S7 |
      skip-cert-verify: true
    exclude-filter: (?i)(剩余|流量|到期|过期|重置|traffic|expire|expired)
  s8-ai-crawler-v2:
    type: http
    path: ./providers/s8_aicrawler.yaml
    # ⚠ 不再直连上游 merged.yaml：上游每小时重生成，时不时夹带字段非法的节点
    #   （2026-09-23 实测：第 2896 个的 reality public-key 写成 enabled、
    #    第 3148 个的 short-id 是裸标量被 YAML 当成科学计数法），
    #   而 mihomo 解析 provider 时遇到第一个非法节点就**整体中止** ——
    #   不是少一个节点，是整个源 0 个节点生效（providers/s8_aicrawler.yaml
    #   从未落地就是这个原因）。
    #   现在指向自己仓库的清洗产物：GitHub Actions 每小时拉上游 →
    #   tools/sanitize_provider.py 按字段清洗 + 内核端到端自检 → 发布为 release 资产。
    #   直连实测可达（HTTP 206，~2.8s 拿到首块）；若哪天变慢/被墙，可添加镜像前缀
    url: https://seep.eu.org/https://github.com/haolive/changfeng/releases/download/s8/s8.yaml
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 2000
      lazy: true
    override:
      additional-prefix: S8 |
      skip-cert-verify: true
    exclude-filter: (?i)(剩余|流量|到期|过期|重置|traffic|expire|expired)
  s9-free18:
    type: http
    path: ./providers/s9_free18.yaml
    url: https://github.boki.moe/https://raw.githubusercontent.com/free18/v2ray/refs/heads/main/c.yaml
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 2000
      lazy: true
    override:
      additional-prefix: S9 |
      skip-cert-verify: true
    exclude-filter: (?i)(剩余|流量|到期|过期|重置|traffic|expire|expired)
  s10-airport:
    type: http
    path: ./providers/s10_airport.yaml
    url: https://github.boki.moe/https://raw.githubusercontent.com/dongchengjie/airport/refs/heads/main/subs/merged/tested_within.yaml
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 2000
      lazy: true
    override:
      additional-prefix: S10 |
      skip-cert-verify: true
    exclude-filter: (?i)(剩余|流量|到期|过期|重置|traffic|expire|expired)

# ---------------- 广告规则集 ----------------
rule-providers:
  # 名字里的【配置已加载】是给日志看的中文标记：内核启动/重载时会打印
  #   Start initial provider 【配置已加载】AWAvenue广告规则
  # 方便一眼确认"本次配置已开始加载"。改名时记得同步改 rules 里那条 RULE-SET。
  秋风AWAvenue广告规则:
    type: http
    behavior: classical      # 文件是 payload 列表，每条自带 DOMAIN/DOMAIN-SUFFIX 前缀
    format: yaml
    url: "https://github.boki.moe/https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml"
    path: ./ruleset/AWAvenue-Ads-Rule.yaml
    interval: 86400
    size-limit: 1048576      # 防异常响应写入超大文件
    proxy: DIRECT            # 拉取走直连，理由同 proxy-providers：别被死节点拖住
  Hyper误杀例外:
    type: http
    behavior: domain
    format: mrs
    url: https://github.boki.moe/https://github.com/Lynricsy/HyperADRules/releases/latest/download/hyper_adrules_allow.mrs
    path: ./ruleset/hyper_adrules_allow.mrs
    interval: 86400
    size-limit: 2097152
    proxy: DIRECT
mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15
global-client-fingerprint: chrome
find-process-mode: strict
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"
profile:
  store-selected: true    # 记忆手动选择的节点
  store-fake-ip: false

# 如启用 TUN（透明代理，可选）：将下方注释的 tun 块取消注释并 enable: true
# tun:
#   enable: false
#   stack: mixed
#   auto-route: true
#   auto-detect-interface: true
#   dns-hijack:
#     - "any:53"

# ---------------- DNS ----------------
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"
    - '+.weixin.qq.com'
    - '+.wechat.com'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"
    - 180.184.1.1
  # 只用国内 DNS，不吃 fallback（2026-09-20 实测：1.1.1.1 / 8.8.8.8 的 HTTPS DoH 在本网络
  # 12 秒超时，不可达）。
  # 原配置带 fallback + fallback-filter.geoip: true，其语义是「非 CN 域名的解析结果必须由
  # fallback 提供」——于是所有需要真实 IP 的非 CN 域名（走 DIRECT 拉取的 github.boki.moe、
  # cdn.jsdelivr.net）都会报 dns resolve failed: couldn't find ip，还要白等十几秒超时。
  # 走代理的流量用 fake-ip，本来就不需要真实解析，所以去掉 fallback 不影响科学上网。
  # 若将来重新引入 fallback，务必同时给镜像域名加 nameserver-policy，否则同样会踩回来。

# ---------------- 代理组 ----------------
# 说明：所有 `include-all: true` 的组会自动包含全部 6 个订阅的节点
# 六个源全是免费池，节点随时会死也会换新 —— 靠「关闭 lazy（主动健康检查）+ 收紧
# timeout/max-failed-times」自动淘汰坏节点，**不长期静态排除某个源**（免费池会换新，静态排除
# 等于永久砍掉一个源，反而少一份可用的候选）。
# 应急手段（默认关闭，见下方注释示例）：某源整批死掉时给对应组临时启用 exclude-filter，
# 节点名前缀 `Sx |` 是我们自己用 additional-prefix 加的，不管上游怎么改命名都匹配得到。
proxy-groups:
  # ==== 基础策略组 ====
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 负载均衡
    default-selected: 自动选择
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 3000
    lazy: true
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/adjust.svg"
  - name: 自动选择
    type: url-test
    include-all: true
    # exclude-filter: "^S4"   # 应急备用：某源整批死掉时临时启用（示例：排除 S4）
    tolerance: 50
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 2000            # 调小：死节点探测更快失败，选举切换更快
    max-failed-times: 2      # 调小：少给一次机会，坏节点下台更快
    # lazy 已移除（默认 false）：主动按 interval 做健康检查。
    # 原来 lazy: true 时日志会打「failed multiple times, activate health check」——
    # 死节点被长期挂住，所有流量都走它，直到失败累积才想起检查。
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/speed.svg"
  - name: 手动选择
    type: select
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 3000
    lazy: true
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/guard.svg"
  - name: 负载均衡
    type: load-balance
    strategy: sticky-sessions
    include-all: true
    # exclude-filter: "^S4"   # 应急备用：同「自动选择」，需要时一并打开
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    timeout: 3000            # 保持宽松：负载均衡是"分摊"不是"选最快"，过度超时淘汰会白丢节点
    max-failed-times: 3
    lazy: true
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/balance.svg"

  # ==== 分流策略组 ====
  - name: 直连
    type: select
    proxies:
      - DIRECT
      - 节点选择
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/link.svg"
  - name: 广告过滤
    type: select
    proxies:
      - REJECT
      - DIRECT
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/bug.svg"
  - name: 漏网之鱼
    type: select
    proxies:
      - 节点选择
      - 自动选择
      - 负载均衡
      - 直连
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io@main/docs/assets/icons/fish.svg"

# ---------------- 分流规则（从上到下匹配，规则后可自定义增删） ----------------
rules:
  # 广告与隐私拦截（必须排在 GEOIP,CN / GEOSITE,cn 直连之前，否则国内广告域名会先被直连吃掉）
  - "RULE-SET,Hyper误杀例外,PASS"
  - "GEOSITE,category-ads-all,广告过滤"
  - "RULE-SET,秋风AWAvenue广告规则,广告过滤"
  # 镜像直连（订阅、规则集、geo 数据库都从这里拉，避免绕道节点被拖死）
  # jsdelivr 实测直连 97ms、下载 1.3s，绕节点纯属浪费（geox-url 也依赖它）
  - "DOMAIN-SUFFIX,boki.moe,直连"
  - "DOMAIN-SUFFIX,jsdelivr.net,直连"
  # 局域网直连
  - "GEOIP,LAN,直连,no-resolve"
  # 国内流量直连
  - "GEOSITE,cn,直连"
  - "GEOIP,CN,直连,no-resolve"
  - "GEOSITE,microsoft@cn,直连"
  - "GEOSITE,apple-cn,直连"
  - "GEOSITE,category-games@cn,直连"
  # 国外服务分流
  - "GEOSITE,telegram,节点选择"
  - "GEOSITE,openai,节点选择"
  - "GEOSITE,google,节点选择"
  - "GEOSITE,netflix,节点选择"
  - "GEOSITE,youtube,节点选择"
  - "GEOSITE,disney,节点选择"
  - "GEOSITE,tiktok,节点选择"
  - "GEOSITE,steam,节点选择"
  - "GEOSITE,epicgames,节点选择"
  - "GEOSITE,category-games,节点选择"
  # 国外网站兜底
  - "GEOSITE,geolocation-!cn,节点选择"
  # 最后兜底
  - "MATCH,漏网之鱼"
