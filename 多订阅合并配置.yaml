# -*- coding: utf-8 -*-
"""
多订阅合并配置编辑器
====================
可视化编辑 Clash Verge Rev / Mihomo 的「多订阅合并配置.yaml」：

  * 全局设置：端口 / 模式 / geo 数据库 / profile 缓存等
  * 订阅源（proxy-providers）：增、删、改名、编辑全部字段（健康检查 / override / 排除过滤）
  * 规则集（rule-providers）：增、删、改名、编辑全部字段
  * 代理组（proxy-groups）：增、删、改名、类型 / include-all / proxies / 测速参数
  * DNS：开关、fake-ip 白名单、上游 DNS 列表
  * 分流规则（rules）：增删改、上下移动排序
  * 原始 YAML：直接查看 / 编辑整份配置文本

说明：
  * 已安装 ruamel.yaml 时按「往返模式」读写，保留原文件中的注释与格式；
    未安装时回退 PyYAML（保存会丢失注释，保存前会弹出警告）。
  * 表单未覆盖到的字段一律原样保留，不会被删除。
  * 每次保存前自动生成同名 .bak 备份。
"""
