# ----------------------------------------------------------------------
# 表单字段包装：统一 get/set 接口
# ----------------------------------------------------------------------
class FieldWrap:
    def __init__(self, kind, getter, setter):
        self.kind = kind
        self._get = getter
        self._set = setter

    def get(self):
        return self._get()

    def set(self, v):
        self._set(v)


# ----------------------------------------------------------------------
# 左列表 + 右表单 的通用条目编辑页（订阅源 / 规则集 / 代理组 共用）
# ----------------------------------------------------------------------
class ItemTab:
    def __init__(self, app, frame, spec, collection_key, mode, title, defaults_fn):
        self.app = app
        self.frame = frame
        self.spec = spec
        self.key = collection_key
        self.mode = mode              # "map"=键值映射 / "list"=数组
        self.title = title
        self.defaults_fn = defaults_fn
        self.sel = None               # 当前选中下标
        self.fields = {}
        self._build()

    # ---------- 布局 ----------
    def _build(self):
        f = self.app.F
        self.frame.grid_columnconfigure(1, weight=1)
        self.frame.grid_rowconfigure(1, weight=1)

        head = ctk.CTkFrame(self.frame, fg_color="transparent")
        head.grid(row=0, column=0, sticky="ew", padx=8, pady=(8, 2))
        ctk.CTkButton(head, text="新建", width=88, font=f,
                      command=self.on_new).pack(side="left", padx=(0, 5))
        ctk.CTkButton(head, text="删除选中", width=88, font=f,
                      fg_color="#8b2f2f", hover_color="#a83a3a", text_color="#ffffff",
                      command=self.on_delete).pack(side="left", padx=(0, 5))
        # 移动按钮放在「新建/删除」后面
        ctk.CTkButton(head, text="上移", width=64, font=f, fg_color="gray40",
                      hover_color="gray55", text_color="#ffffff",
                      command=lambda: self.on_move(-1)).pack(side="left", padx=(0, 5))
        ctk.CTkButton(head, text="下移", width=64, font=f, fg_color="gray40",
                      hover_color="gray55", text_color="#ffffff",
                      command=lambda: self.on_move(1)).pack(side="left")

        self.list_box = ctk.CTkScrollableFrame(self.frame, width=360)
        self.list_box.grid(row=1, column=0, sticky="ns", padx=8, pady=(2, 8))

        # 右列：顶部操作条 + 表单（操作条与「分流规则」页保持一致）
        right = ctk.CTkFrame(self.frame, fg_color="transparent")
        right.grid(row=0, column=1, rowspan=2, sticky="nsew", padx=(4, 8), pady=8)
        right.grid_rowconfigure(1, weight=1)
        right.grid_columnconfigure(0, weight=1)

        bar = ctk.CTkFrame(right, fg_color="transparent")
        bar.grid(row=0, column=0, sticky="ew")
        ctk.CTkButton(bar, text="保存修改到选中", width=140, font=f,
                      command=self.on_apply).pack(side="left", padx=(0, 8))
        ctk.CTkLabel(bar, text="切换条目 / 新建 / 上移下移 / 保存文件时也会自动写回",
                     font=self.app.FS, text_color=("#57606a", "#8a9299")).pack(side="left")

        form = ctk.CTkScrollableFrame(right)
        form.grid(row=1, column=0, sticky="nsew")
        self.app.build_spec_form(form, self.spec, self.fields)

        hint = ("提示：新建在选中条目下方插入；修改名称后保存会自动重命名；"
                "表单未覆盖的字段原样保留，可在「原始YAML」页编辑。")
        ctk.CTkLabel(form, text=hint, font=self.app.FS,
                     text_color=("#57606a", "#8a9299"), anchor="w").grid(
            row=999, column=0, columnspan=2, sticky="w", pady=(14, 2))

    # ---------- 数据访问 ----------
    def container(self, create=False):
        data = self.app.data
        if data is None:
            return None
        if self.key not in data:
            if not create:
                return None
            data[self.key] = {} if self.mode == "map" else []
        return data[self.key]

    def names(self):
        cont = self.container()
        if cont is None:
            return []
        if self.mode == "map":
            return [str(k) for k in cont.keys()]
        return [str(it.get("name", f"项{i + 1}")) for i, it in enumerate(cont)]

    def item_at(self, i):
        cont = self.container()
        if cont is None:
            return None
        if self.mode == "map":
            keys = list(cont.keys())
            return cont[keys[i]] if 0 <= i < len(keys) else None
        return cont[i] if 0 <= i < len(cont) else None

    # ---------- 列表 ----------
    def refresh_list(self):
        for w in self.list_box.winfo_children():
            w.destroy()
        for i, name in enumerate(self.names()):
            selected = (i == self.sel)
            btn = ctk.CTkButton(
                self.list_box, text=name, anchor="w", font=self.app.F,
                fg_color="#2b5b8a" if selected else "transparent",
                hover_color="#2b5b8a" if selected else ("gray70", "gray30"),
                text_color="#ffffff" if selected else ("gray10", "#dcdcdc"),
                command=lambda i=i: self.select(i))
            btn.pack(fill="x", padx=6, pady=2)

    def select(self, i):
        try:
            self.commit()
        except CommitError as e:
            self.app.log(f"[{self.title}] 未切换：{e}", "err")
            mb.showwarning(self.title, str(e))
            return
        self.sel = i
        self.load_form()
        self.refresh_list()

    # ---------- 表单 ----------
    def load_form(self):
        item = self.item_at(self.sel) if self.sel is not None else None
        if item is None:
            return
        if self.mode == "map":
            keys = list(self.container().keys())
            key = keys[self.sel]
            self.fields["name"].set(str(key))
            self.app.load_spec(item, [s for s in self.spec if s[0] != "name"], self.fields)
        else:
            self.app.load_spec(item, self.spec, self.fields)

    def clear_form(self):
        """清空右侧表单（打开新文件或应用原始 YAML 后调用，避免残留上一个文件的值）"""
        for path, _label, kind, _e, _o in self.spec:
            if kind == "sep" or path not in self.fields:
                continue
            fld = self.fields[path]
            if kind == "switch":
                fld.set(False)
            elif kind == "textlines":
                fld.set([])
            else:
                fld.set("")

    def commit(self):
        """把右侧表单写回当前选中条目；无选中或数据未加载时不动"""
        if self.sel is None or self.app.data is None:
            return
        cont = self.container()
        if cont is None:
            return
        n = len(self.names())
        if self.sel >= n:
            self.sel = None
            return
        if self.mode == "map":
            old_name = list(cont.keys())[self.sel]
            item = cont[old_name]
        else:
            item = cont[self.sel]
            old_name = str(item.get("name", ""))

        new_name = str(self.fields["name"].get()).strip()
        if not new_name:
            raise CommitError(f"「名称」不能为空")

        if self.mode == "map":
            # 键名即名称，不写进条目内部
            self.app.apply_spec(item, [s for s in self.spec if s[0] != "name"], self.fields)
            if new_name != old_name:
                if new_name in cont:
                    raise CommitError(f"名称「{new_name}」已存在")
                rename_map_key(cont, old_name, new_name)
                self.app.log(f"[{self.title}] 「{old_name}」已改名为「{new_name}」")
        else:
            self.app.apply_spec(item, self.spec, self.fields)
            if new_name != old_name:
                self.app.log(f"[{self.title}] 「{old_name}」已改名为「{new_name}」")
                rules = self.app.data.get("rules") or []
                refs = sum(1 for r in rules if isinstance(r, str) and old_name in r)
                if refs:
                    self.app.log(
                        f"[{self.title}] 注意：有 {refs} 条分流规则仍引用旧名「{old_name}」，"
                        f"请到「分流规则」页同步修改", "warn")
        if self.post_apply is not None:
            self.post_apply(item)

    def on_apply(self):
        """「保存修改到选中」：把右侧表单写回当前选中条目"""
        if self.sel is None:
            self.app.log(f"[{self.title}] 请先在左侧列表选中一项再保存修改", "warn")
            return
        try:
            self.commit()
        except CommitError as e:
            self.app.log(f"[{self.title}] 保存失败：{e}", "err")
            mb.showwarning(self.title, str(e))
            return
        if self.sel is not None:
            self.app.log(f"[{self.title}] 已保存修改到「{self.names()[self.sel]}」", "ok")
        self.load_form()          # 名称可能已改，重新载入显示最新数据
        self.refresh_list()

    def post_apply(self, item):
        """子类钩子：写回后的额外处理"""
        pass

    def group_post_apply(self, item):
        """代理组专用：include-all 与 proxies 的联动校验"""
        if item.get("include-all"):
            item.pop("proxies", None)
        elif not item.get("proxies"):
            raise CommitError(
                f"代理组「{item.get('name', '?')}」未开启 include-all，"
                f"节点列表 proxies 至少要有一行")

    def provider_post_apply(self, item):
        """订阅源专用：exclude-filter 里出现「品牌推广型」关键词时提醒（只提醒，不阻止保存）

        这些词在真实节点名里也常见（某机场所有节点名都挂着 TG 频道名），命中会误杀好节点；
        最坏情况过滤后一个不剩，内核只报一行 pull error: file doesn't have any proxy，
        整个源静默清零 —— 所以宁可提醒，也别让它悄悄生效。
        """
        hits = risky_exclude_words(item.get("exclude-filter"))
        if not hits:
            return
        self.app.log(f"[{self.title}] 排除词含推广型关键词 {'、'.join(hits)}，可能误杀真节点", "warn")
        mb.showwarning(
            f"{self.title} · 排除词风险",
            "排除词里含 %s 这类「品牌推广型」关键词。\n\n"
            "真实节点名里也常带这些词（例如某个机场的节点名统一挂着 TG 频道名），"
            "命中会把好节点一起剔掉；极端情况下过滤后一个不剩，内核只报一行 "
            "`pull error: file doesn't have any proxy`，整个源静默清零。\n\n"
            "建议只保留状态型词：剩余|流量|到期|过期|重置|traffic|expire|expired"
            % "、".join(hits))

    # ---------- 增删 ----------
    def on_new(self):
        try:
            self.commit()
        except CommitError as e:
            self.app.log(f"[{self.title}] {e}", "warn")
        cont = self.container(create=True)
        n = len(self.names())
        # 在选中条目下方插入；未选中时加到末尾
        pos = (self.sel + 1) if self.sel is not None and self.sel < n else n
        prev_name = self.names()[pos - 1] if pos > 0 else None
        idx = n + 1
        if self.mode == "map":
            k = f"s{idx}-new"
            while k in cont:
                idx += 1
                k = f"s{idx}-new"
            insert_map_item(cont, pos, k, self.defaults_fn(idx))
            new_name = k
        else:
            item = self.defaults_fn(idx)
            # 组名等显示名不允许重复，必要时追加序号
            existing = set(self.names())
            if "name" in item and item["name"] in existing:
                base = item["name"]
                k = 2
                while f"{base}{k}" in existing:
                    k += 1
                item["name"] = f"{base}{k}"
            cont.insert(pos, item)
            new_name = str(item.get("name", f"项{pos + 1}"))
        self.sel = pos
        self.load_form()
        self.refresh_list()
        where = f"「{prev_name}」下方" if prev_name else "列表末尾"
        self.app.log(f"[{self.title}] 已在{where}新建「{new_name}」（模板默认值，请核对各字段）")

    def on_move(self, delta):
        """上移/下移当前选中条目"""
        if self.sel is None:
            self.app.log(f"[{self.title}] 请先在左侧列表选中一项再移动", "warn")
            return
        try:
            self.commit()          # 先把表单改动落盘，避免移动后错位
        except CommitError as e:
            self.app.log(f"[{self.title}] 未移动：{e}", "err")
            return
        cont = self.container()
        n = len(self.names())
        j = self.sel + delta
        if not (0 <= j < n):
            return
        name_i, name_j = self.names()[self.sel], self.names()[j]
        if self.mode == "map":
            move_map_item(cont, self.sel, j)
        else:
            seq_swap_with_comments(cont, self.sel, j)
        self.sel = j
        self.refresh_list()
        self.app.log(f"[{self.title}] 「{name_i}」已{'上' if delta < 0 else '下'}移"
                     f"（原「{name_j}」的位置）")

    def on_delete(self):
        if self.sel is None:
            self.app.log(f"[{self.title}] 请先在左侧列表选中一项再删除", "warn")
            return
        name = self.names()[self.sel]
        if not mb.askyesno("删除确认", f"确定删除「{name}」吗？\n（保存前可点「重新加载」撤销）"):
            return
        cont = self.container()
        if self.mode == "map":
            keys = list(cont.keys())
            del cont[keys[self.sel]]
        else:
            cont.pop(self.sel)
        self.sel = None
        self.refresh_list()
        self.app.log(f"[{self.title}] 已删除「{name}」（保存后生效）")


