# 纯去广告 Clash 配置（无名的人）
# 不包含任何代理节点，仅用于广告拦截


# 规则提供者
rule-providers:
  AWAvenue:
    type: http
    behavior: domain
    format: yaml
    path: ./rule_provider/AWAvenue-Ads-Rule-Clash.yaml
    url: https://github.boki.moe/https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml
    interval: 7200

# 代理组
proxy-groups:
  - name: "⛔️📵广告"
    type: select
    proxies:
      - DIRECT

# 规则
rules:
  - RULE-SET,AWAvenue,REJECT
  - MATCH,DIRECT
