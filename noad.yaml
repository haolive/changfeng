# 纯去广告 Clash 配置（无名的人）
# 不包含任何代理节点，仅用于广告拦截


rule-providers:
  AWAvenue:
    输入: http
    behavior: domain
    format: yaml
    url: https://github.boki.moe/https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml
    path: ./ruleset/adblock_reject.yaml
    interval: 120
    
# 代理组
proxy-groups:
  - name: "🌐 漏网之鱼"
    type: select
    proxies:
      - DIRECT

# 规则
rules:
  - RULE-SET,AWAvenue,REJECT
