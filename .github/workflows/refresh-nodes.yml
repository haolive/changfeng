name: refresh-nodes

# 把「多订阅合并配置.yaml」里的 10 个 proxy-providers 合成一个节点池，逐个测速
# （延迟 + 真实下载 512KB），只把活下来的节点发出来：
#
#   release 资产 best.yaml   —— 完整配置（DNS/策略组/分流规则/广告规则集原样保留，
#                               proxy-providers 段换成测速后的 inline proxies）
#                               https://github.com/haolive/changfeng/releases/download/best/best.yaml
#   release 资产 nodes.yaml  —— 只有 proxies 的清单，想自己组装配置时当 proxy-provider 用
#
# 为什么不在客户端里过滤：客户端的健康检查只能"发现"某个节点不通，删不掉它 ——
# 列表越长，客户端每次要测的就越多，界面上看到的废节点也越多。放到 runner 上跑一遍，
# 客户端拿到的就是"已经筛过一遍"的干净列表。
#
# 产物只在 release 里覆盖更新（不提交进 git，否则仓库每天涨几十 MB）；
# 最后一步的 keepalive 是为了防止"公开仓库连续 60 天没有提交 → schedule 被自动停用"。
#
# ⚠ 可靠性加固（2026-10-20）：本工作流历史 6 次失败里 3 次死在"下载 mihomo"这一步
#   （jq: Cannot iterate over null），1 次死在"内核校验"（geo 数据损坏），1 次死在
#   "发布 release"（gh 接口 502）。都是外部接口瞬时抖动 + 无重试，下面逐个加了兜底，
#   排查失败时别把这几段改回裸调用。

on:
  schedule:
    - cron: '47 * * * *'        # 每小时第 47 分钟（GitHub 用 UTC；整小时偏移，所以北京时间也是 :47）
                                # ⚠ 定时触发不保证准时：实测有延迟几十分钟、甚至整点漏跑的情况
                                #   （免费 runner 在高峰期的已知行为）。想更密集就把这行改成
                                #   '17,47 * * * *'（每小时两次），或 '*/30 * * * *'（每 30 分钟）。
  workflow_dispatch:            # 也可以手动触发（改完想看效果就用它，别等定时）

permissions:
  contents: write               # 创建 / 更新 release 资产需要

concurrency:
  group: refresh-nodes
  cancel-in-progress: true      # 上一次还没跑完就被下一次取代时，取消旧的

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet pyyaml

      # 拿不到 mihomo 后面全白跑，所以这段必须稳。原实现只有一行裸 curl + jq：
      #   - 未鉴权调 api.github.com 只有 60 次/小时配额，runner 出口 IP 又是共享的，
      #     整点定时一堆仓库同时跑很容易撞限流（403），偶尔也直接 5xx；
      #   - 这两种情况响应里都没有 .assets，jq 报 "Cannot iterate over null"，
      #     set -euo pipefail 立刻退出，把整轮搞挂（2026-10-15/17/19 三次实测）；
      #   - curl -s 还把真实错误吞了，日志里只剩一句 jq 报错，看不出是 403 还是 5xx。
      # 现在：重试 5 次 + 校验 url 非空 + 回退到写死的已知直链 + 下载后 gzip -t 校验。
      - name: 下载 mihomo（测速内核）
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          # 回退直链：API 连重试都拿不到地址时用它兜底。版本号会随上游发布前移，
          # 万一这个 404 了就把 pin 升到最新（mihomo 老版本同样能用，只是内核新点更好）。
          fallback="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1-v1.19.32.gz"
          url=""
          for attempt in 1 2 3 4 5; do
            # -f：HTTP 4xx/5xx 直接判失败，别把错误页当内容解析；去掉 -s 让真实错误进日志
            json=$(curl -fsSL --max-time 30 "$api_url" 2>/dev/null) || {
              echo "::warning::GitHub API 第 $attempt 次失败，$((attempt*5))s 后重试"
              sleep $((attempt*5)); continue
            }
            url=$(printf '%s' "$json" | jq -r '.assets[].browser_download_url' 2>/dev/null \
                    | grep -E 'linux-amd64-v[0-9]' | head -n1 || true)
            if [ -n "$url" ]; then break; fi
            echo "::warning::API 响应里没有可用 assets（大概率被限流），第 $attempt 次重试"
            sleep $((attempt*5))
          done
          if [ -z "$url" ]; then
            echo "::warning::API 拿不到下载地址，改用 pin 直链：$fallback"
            url="$fallback"
          fi
          echo "downloading $url"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o mihomo.gz "$url"
          gzip -t mihomo.gz            # 解压前先校验：坏包在这里当场暴露，别把坏包解出来跑
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: 合并 10 个源（清洗 + 前缀 + 去重）
        run: |
          set -euo pipefail
          python tools/fetch_node_pool.py \
            --config 多订阅合并配置.yaml \
            --out dist/pool.yaml \
            --stats dist/pool-stats.json

      # ⚠ 两个 tag 的资产名都必须是 best.yaml / nodes.yaml（客户端订阅地址指着它们），
      #   所以各自放在子目录里产出、再整目录上传（gh release upload 用的是文件名）。
      - name: 逐个测速（延迟 + 下载），同时产出 best 与 fast
        run: |
          set -euo pipefail
          python tools/test_nodes.py \
            --pool dist/pool.yaml \
            --config 多订阅合并配置.yaml \
            --core ./mihomo \
            --out dist/best/best.yaml \
            --nodes-out dist/best/nodes.yaml \
            --notes dist/best/notes.md \
            --fast-out dist/fast/best.yaml \
            --fast-nodes-out dist/fast/nodes.yaml \
            --fast-notes dist/fast/notes.md \
            --fast-types "http,anytls" \
            --stats dist/filter-stats.json \
            --pool-stats dist/pool-stats.json \
            --core-log dist/core.log \
            --latency-url "http://www.gstatic.com/generate_204" \
            --latency-timeout 3000 \
            --max-latency 2000 \
            --speed-url "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" \
            --speed-url-fallback "https://speed.cloudflare.com/__down?bytes={bytes}" \
            --speed-bytes 524288 \
            --speed-timeout 10 \
            --min-speed-kbps 100 \
            --speed-limit 800 \
            --max-nodes 600 \
            --concurrency 64 \
            --min-keep 0

      # 产物本身也过一遍内核：`-t` 会解析全部 inline proxies（字段非法会直接报错），
      # 顺带校验合并后的配置结构。
      # ⚠ 2026-10-15 那次失败是 geo 数据"拉下来了但损坏"：curl 对损坏文件照样返回 0，
      #   只挡"完全拉不到"不够，损坏的 geosite.dat 会让 mihomo -t 判失败、把整轮打回。
      #   所以现在：下载加 --retry + 体积校验；且 -t 失败时按报错内容分锅 ——
      #   报的是 geo/geodata 就说明是环境问题、与产物无关，告警跳过；否则才 fail。
      - name: 内核校验产物
        run: |
          set -euo pipefail
          geodir=$(mktemp -d)
          geo_ok=1
          for f in geosite.dat geoip.dat; do
            if ! curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --max-time 90 \
                  -o "$geodir/$f" \
                  "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/$f"; then
              echo "::warning::$f 下载失败"
              geo_ok=0; break
            fi
            # 正常 geosite.dat / geoip.dat 都是几 MB 量级；太小说明是错误页或半截包
            size=$(wc -c < "$geodir/$f")
            if [ "$size" -lt 1048576 ]; then
              echo "::warning::$f 只有 $size 字节，当作没拉到"
              geo_ok=0; break
            fi
          done
          if [ "$geo_ok" != "1" ]; then
            echo "::warning::geo 数据没拉全，跳过 mihomo -t 校验（与产物本身无关）"
            exit 0
          fi
          check_product() {                       # $1=配置文件路径
            local out
            if out=$(./mihomo -t -f "$1" -d "$geodir" 2>&1); then
              echo "OK: $1"
              return 0
            fi
            if printf '%s' "$out" | grep -qiE 'geodata|geosite|geoip|geo data'; then
              echo "::warning::$1 的 -t 失败原因是 geo 数据，与产物本身无关"
              return 0
            fi
            printf '%s\n' "$out" | tail -n 20
            return 1
          }
          check_product dist/best/best.yaml
          check_product dist/fast/best.yaml
          echo "产物通过内核校验"

      # 两个 tag：best（全量、全球可达性过滤）+ fast（在 best 基础上按类型收窄，见 --fast-types）
      #
      # ⚠ 这一步最容易"整轮白跑"：2026-09-24 那次 run 36073163501，前面的合并 / 测速 /
      #    内核校验**全部成功**，只有这里挂了（gh 的 release 接口偶发 5xx，实测 HTTP 502），
      #    结果几十分钟的计算全白费、产物没更新。所以每次调用都包一层重试；
      #    重试仍失败才让这一步失败（那时确实该失败）。别删掉 retry()。
      - name: 发布到 release（tag best 与 fast）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          retry() {
            local n=0
            while true; do
              if "$@"; then return 0; fi
              n=$((n + 1))
              if [ "$n" -ge 4 ]; then
                echo "::error::$* 连续 $n 次失败，放弃"
                return 1
              fi
              echo "::warning::$* 第 $n 次失败，$((n * 15))s 后重试"
              sleep $((n * 15))
            done
          }

          ensure_release() {          # $1=tag  $2=notes 文件  $3=标题
            if gh release view "$1" >/dev/null 2>&1; then return 0; fi
            gh release create "$1" --title "$3" --notes-file "$2"
          }

          retry ensure_release best dist/best/notes.md "best（测速过滤后的订阅）"
          retry gh release upload best dist/best/best.yaml dist/best/nodes.yaml --clobber
          retry gh release edit best --notes-file dist/best/notes.md

          retry ensure_release fast dist/fast/notes.md "fast（优先订阅）"
          retry gh release upload fast dist/fast/best.yaml dist/fast/nodes.yaml --clobber
          retry gh release edit fast --notes-file dist/fast/notes.md

          echo "已更新 https://github.com/${{ github.repository }}/releases/download/best/best.yaml"
          echo "已更新 https://github.com/${{ github.repository }}/releases/download/fast/best.yaml"

      - name: 保存测速日志（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-log
          path: dist/core.log
          retention-days: 7
          if-no-files-found: ignore

      # 保活 + 审计：只更新 release 资产不产生 commit，而公开仓库连续 60 天没有提交活动
      # schedule 会被自动停用。所以按需提交一个小统计文件（源挂了/恢复了、或上游坏节点
      # 集合变了、或超过 7 天没提交时才写），正常一周最多一两次。
      - name: 保活 / 审计（按需提交统计）
        run: |
          set -euo pipefail
          mkdir -p stats
          out=$(python tools/keepalive.py --stats dist/filter-stats.json \
                  --store stats/node-filter-stats.json --max-age-days 7)
          echo "$out"
          if printf '%s\n' "$out" | head -n1 | grep -qx update; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats/node-filter-stats.json
            if git diff --cached --quiet; then
              echo "文件内容没变，跳过提交"
            else
              git commit -m "chore(stats): 节点测速统计（源变化或超 7 天保活）"
              git push || echo "::warning::git push 失败（仓库可能同时有别的改动），下次运行再试"
            fi
          else
            echo "统计无实质变化，跳过提交（保持提交历史干净）"
          fi
