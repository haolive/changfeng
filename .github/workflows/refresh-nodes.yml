name: refresh-nodes

# 把「多订阅合并配置.yaml」里的 10 个 proxy-providers 合成一个节点池，用两个
# generate_204 端点各探一遍（**都必须通过**），只把"活着且能出网"的节点发出来：
#
#   release 资产 best.yaml   —— 完整配置（DNS/策略组/分流规则/广告规则集原样保留，
#                               proxy-providers 段换成筛过的 inline proxies）
#                               https://github.com/haolive/changfeng/releases/download/best/best.yaml
#   release 资产 nodes.yaml  —— 只有 proxies 的清单，想自己组装配置时当 proxy-provider 用
#
# 为什么不在客户端里过滤：客户端的健康检查只能"发现"某个节点不通，删不掉它 ——
# 列表越长，客户端每次要测的就越多，界面上看到的废节点也越多。放到 runner 上跑一遍，
# 客户端拿到的就是"已经筛过一遍"的干净列表。
#
# ⚠ 2026-09-25 起口径是「只去死节点」：**不再卡延迟上限、不再测下载带宽**。
#   判据只有一条 —— 两个端点都得通。理由：这份产物还要被下游（CNB 那边从国内视角）
#   再筛一遍，在这里按速度砍掉一批，等于用"境外机房的尺度"替国内做决定，把可能
#   好用的节点提前扔了。速度的事留给离你更近的那一层去判。
#
# 产物只在 release 里覆盖更新（不提交进 git，否则仓库每天涨几十 MB）；
# 最后一步的 keepalive 是为了防止"公开仓库连续 60 天没有提交 → schedule 被自动停用"。

on:
  schedule:
    - cron: '47 * * * *'        # 每小时第 47 分钟（GitHub 用 UTC；整小时偏移，所以北京时间也是 :47）
                                # ⚠ 定时触发不保证准时：实测有延迟几十分钟、甚至整点漏跑的情况
                                #   （免费 runner 在高峰期的已知行为）。想更密集就把这行改成
                                #   '17,47 * * * *'（每小时两次），或 '*/30 * * * *'（每 30 分钟）。
  workflow_dispatch:            # 也可以手动触发（改完想看效果就用它，别等定时）

permissions:
  contents: write               # 创建 / 更新 release 资产需要

concurrency:
  group: refresh-nodes
  cancel-in-progress: true      # 上一次还没跑完就被下一次取代时，取消旧的

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install --quiet pyyaml

      - name: 下载 mihomo（探测内核）
        run: |
          set -euo pipefail
          url=$(curl -sSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
                | jq -r '.assets[].browser_download_url' \
                | grep -E 'linux-amd64-v[0-9]' | head -n1)
          echo "downloading $url"
          curl -sSL -o mihomo.gz "$url"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: 合并 10 个源（清洗 + 前缀 + 去重）
        run: |
          set -euo pipefail
          python tools/fetch_node_pool.py \
            --config 多订阅合并配置.yaml \
            --out dist/pool.yaml \
            --stats dist/pool-stats.json

      # ⚠ 两个 tag 的资产名都必须是 best.yaml / nodes.yaml（客户端订阅地址指着它们），
      #   所以各自放在子目录里产出、再整目录上传（gh release upload 用的是文件名）。
      - name: 两轮探测（两个端点都必须通），同时产出 best 与 fast
        run: |
          set -euo pipefail
          python tools/test_nodes.py \
            --pool dist/pool.yaml \
            --config 多订阅合并配置.yaml \
            --core ./mihomo \
            --out dist/best/best.yaml \
            --nodes-out dist/best/nodes.yaml \
            --notes dist/best/notes.md \
            --fast-out dist/fast/best.yaml \
            --fast-nodes-out dist/fast/nodes.yaml \
            --fast-notes dist/fast/notes.md \
            --fast-types "http,anytls" \
            --stats dist/filter-stats.json \
            --pool-stats dist/pool-stats.json \
            --core-log dist/core.log \
            --latency-url "http://www.gstatic.com/generate_204" \
            --latency-timeout 3000 \
            --max-latency 8000 \
            --verify-url "http://cp.cloudflare.com/generate_204" \
            --verify-expected 204 \
            --verify-timeout 3000 \
            --speed-limit 0 \
            --max-nodes 0 \
            --concurrency 64 \
            --min-keep 0
          # 口径说明（改上面的参数时记得同步这里）：
          #   --latency-expected 故意不传 = 第一轮不校验状态码，只有"3000ms 内有没有响应"。
          #     第一轮宽、第二轮严（复核轮强制 204）—— 宽进严出，既不误杀慢节点，
          #     也挡得住"握手通、真跑流量就废"的假通节点。
          #   --max-latency 8000：比 --latency-timeout 大，等于**不限延迟**（超时那一刻
          #     就已经判死了，这条线永远碰不到）。写 8000 只是留一个显式上限，防手滑。
          #   --speed-limit 0 = 完全不测下载带宽（第二轮判据只剩连通性）。
          #   --max-nodes 0 = 数量不限：既然不按速度排序，再按延迟截断就等于偷偷加了
          #     别的筛选条件。产物会变大，客户端侧本来就是拿它当 provider 用，扛得住。

      # 产物本身也过一遍内核：`-t` 会解析全部 inline proxies（字段非法会直接报错），
      # 顺带校验合并后的配置结构。geo 数据拉不到时跳过（那说明不了产物有问题）。
      - name: 内核校验产物
        run: |
          set -euo pipefail
          geodir=$(mktemp -d)
          ok=1
          for f in geosite.dat geoip.dat; do
            curl -sSL --max-time 90 -o "$geodir/$f" \
              "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/$f" || ok=0
          done
          if [ "$ok" = "1" ]; then
            ./mihomo -t -f dist/best/best.yaml -d "$geodir"
            ./mihomo -t -f dist/fast/best.yaml -d "$geodir"
            echo "产物通过内核校验"
          else
            echo "::warning::geo 数据没拉全，跳过 mihomo -t 校验（与产物本身无关）"
          fi

      # 两个 tag：best（全量、全球可达性过滤）+ fast（在 best 基础上按类型收窄，见 --fast-types）
      #
      # ⚠ 这一步最容易"整轮白跑"：2026-09-24 那次 run 36073163501，前面的合并 / 两轮探测 /
      #    内核校验**全部成功**，只有这里挂了（gh 的 release 接口偶发 5xx / 限流），
      #    结果几十分钟的计算全白费、产物没更新。所以每次调用都包一层重试；
      #    重试仍失败才让这一步失败（那时确实该失败）。
      - name: 发布到 release（tag best 与 fast）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          retry() {
            local n=0
            while true; do
              if "$@"; then return 0; fi
              n=$((n + 1))
              if [ "$n" -ge 4 ]; then
                echo "::error::$* 连续 $n 次失败，放弃"
                return 1
              fi
              echo "::warning::$* 第 $n 次失败，$((n * 15))s 后重试"
              sleep $((n * 15))
            done
          }

          ensure_release() {          # $1=tag  $2=notes 文件
            if gh release view "$1" >/dev/null 2>&1; then return 0; fi
            gh release create "$1" --title "$1" --notes-file "$2"
          }

          retry ensure_release best dist/best/notes.md
          retry gh release upload best dist/best/best.yaml dist/best/nodes.yaml --clobber
          retry gh release edit best --notes-file dist/best/notes.md

          retry ensure_release fast dist/fast/notes.md
          retry gh release upload fast dist/fast/best.yaml dist/fast/nodes.yaml --clobber
          retry gh release edit fast --notes-file dist/fast/notes.md

          echo "已更新 https://github.com/${{ github.repository }}/releases/download/best/best.yaml"
          echo "已更新 https://github.com/${{ github.repository }}/releases/download/fast/best.yaml"

      - name: 保存内核日志（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-log
          path: dist/core.log
          retention-days: 7
          if-no-files-found: ignore

      # 保活 + 审计：只更新 release 资产不产生 commit，而公开仓库连续 60 天没有提交活动
      # schedule 会被自动停用。所以按需提交一个小统计文件（源挂了/恢复了、或上游坏节点
      # 集合变了、或超过 7 天没提交时才写），正常一周最多一两次。
      - name: 保活 / 审计（按需提交统计）
        run: |
          set -euo pipefail
          mkdir -p stats
          out=$(python tools/keepalive.py --stats dist/filter-stats.json \
                  --store stats/node-filter-stats.json --max-age-days 7)
          echo "$out"
          if printf '%s\n' "$out" | head -n1 | grep -qx update; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats/node-filter-stats.json
            if git diff --cached --quiet; then
              echo "文件内容没变，跳过提交"
            else
              git commit -m "chore(stats): 节点过滤统计（源变化或超 7 天保活）"
              git push || echo "::warning::git push 失败（仓库可能同时有别的改动），下次运行再试"
            fi
          else
            echo "统计无实质变化，跳过提交（保持提交历史干净）"
          fi